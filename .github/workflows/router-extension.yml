name: Native HTTP extension helper checks
on:
  pull_request:
    paths:
      - experiments/router-extension/**
      - .github/workflows/router-extension.yml
      - tools/stage_router_runtime.sh
      - tools/stage_durable_router_probe.sh
      - tools/probe_hust_terminal_driver.py
      - src/prefix_routing_mod/terminal_transport.py
      - src/prefix_routing_mod/terminal_journal.py
      - src/prefix_routing_mod/hust_terminal.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: router-extension-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check shared helper and deterministic transport regressions
        run: |
          bash -n tools/stage_router_runtime.sh
          bash -n tools/stage_durable_router_probe.sh
          cargo +1.99.0 fmt --manifest-path experiments/router-extension/checks/Cargo.toml --check
          rustfmt +1.99.0 --edition 2021 --config skip_children=true --check experiments/router-extension/live_terminal_chain.rs
          rustfmt +1.99.0 --edition 2021 --config skip_children=true --check experiments/router-extension/runtime_provider_probe.rs
          rustfmt +1.99.0 --edition 2021 --config skip_children=true --check experiments/router-extension/runtime_owner_probe.rs
          rustfmt +1.99.0 --edition 2021 --check experiments/router-extension/runtime_cache_port.rs
          rustfmt +1.99.0 --edition 2021 --check experiments/router-extension/native_kv_wire.rs
          rustfmt +1.99.0 --edition 2021 --check experiments/router-extension/native_kv_owner.rs
          rustfmt +1.99.0 --edition 2021 --check experiments/router-extension/native_kv_zmq.rs
          rustfmt +1.99.0 --edition 2021 --config skip_children=true --check experiments/router-extension/runtime_cache_owner_probe.rs
          rustfmt +1.99.0 --edition 2021 --config skip_children=true --check experiments/router-extension/hust_runtime_probe.rs
          rustfmt +1.99.0 --edition 2021 --check experiments/router-extension/checks/examples/sqlite_runtime_store_probe.rs
          cargo +1.99.0 clippy --locked --manifest-path experiments/router-extension/checks/Cargo.toml --all-targets -- -D warnings
          cargo +1.99.0 test --locked --manifest-path experiments/router-extension/checks/Cargo.toml
      - name: Finite and background drivers against observer HTTP (CPU core substitute)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          cargo +1.99.0 build --locked --manifest-path experiments/router-extension/checks/Cargo.toml --example hust_terminal_driver_probe
          python -m tools.probe_hust_terminal_driver --binary experiments/router-extension/checks/target/debug/examples/hust_terminal_driver_probe
