[package]
name = "prefix-router-extension-checks"
version = "0.1.0"
edition = "2021"
publish = false

# Match the fixed host's versions; this crate tests the very same helper file.
[dependencies]
reqwest = { version = "=0.13.5", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
http-body = "=1.1.0"
bytes = "=1.12.1"
futures-util = "=0.3.34"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["time", "macros", "rt", "sync", "test-util", "signal"] }
